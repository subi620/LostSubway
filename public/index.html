<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로스트인지하철 · 지하철 분실물 찾기</title>
<meta name="description" content="지하철에서 잃어버린 물건을 LOST112 공식 습득물 목록에서 역·물품·기간으로 찾아드려요.">
<meta name="theme-color" content="#111827">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-logo" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M9 9.2a1.6 1.6 0 1 1 3 .8c-.6.4-1.5.8-1.5 1.7"/><path d="M10.5 13.4h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
  <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
  <symbol id="i-wallet" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14h2"/></symbol>
  <symbol id="i-phone" viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18.5h2"/></symbol>
  <symbol id="i-bag" viewBox="0 0 24 24"><path d="M5 8h14l-1.2 11.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></symbol>
  <symbol id="i-umbrella" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v6.5a2 2 0 0 1-4 0"/><path d="M12 3v0"/></symbol>
  <symbol id="i-earbuds" viewBox="0 0 24 24"><path d="M7.5 4A3.5 3.5 0 0 0 4 7.5v1A3.5 3.5 0 0 0 7.5 12H9V4z"/><path d="M9 12v7"/><path d="M16.5 4A3.5 3.5 0 0 1 20 7.5v1a3.5 3.5 0 0 1-3.5 3.5H15V4z"/><path d="M15 12v7"/></symbol>
  <symbol id="i-dots" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12h.01M12 12h.01M15.5 12h.01"/></symbol>
  <symbol id="i-call" viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s-7-6.5-7-12a7 7 0 0 1 14 0c0 5.5-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></symbol>
  <symbol id="i-train" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M9 21l1.5-4M15 21l-1.5-4M9 13.5h.01M15 13.5h.01"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.9-3M4 5v3h3M4 13a8 8 0 0 0 14.9 3M20 19v-3h-3"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
  <symbol id="i-bookmark" viewBox="0 0 24 24"><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4-6 4V4.5a1 1 0 0 1 1-1z"/></symbol>
</svg>

<div class="app">
  <!-- ① 검색 -->
  <section class="view" id="view-search" aria-labelledby="search-title" hidden>
    <header class="s-brand">
      <a class="brand" href="#/" aria-label="로스트인지하철 처음으로">
        <span class="brand-mark"><svg class="ic" aria-hidden="true"><use href="#i-logo"></use></svg></span>
        <span class="brand-text">
          <span class="brand-name">로스트<em>인</em>지하철</span>
          <span class="brand-sub">LOST IN SUBWAY</span>
        </span>
      </a>
      <h1 id="search-title" class="s-title" tabindex="-1">지하철에서 잃어버린 물건, 역 이름으로 찾아드려요</h1>
    </header>

    <form class="search-body" id="search-form" novalidate>
      <div class="search-dock">
        <div class="station-field">
          <label class="sr" for="station-input">역 이름</label>
          <div class="station-box glass" id="station-box">
            <svg class="ic s-ic" aria-hidden="true"><use href="#i-search"></use></svg>
            <span class="badges" id="station-badges"></span>
            <input id="station-input" type="text" autocomplete="off" spellcheck="false" enterkeyhint="search"
                   placeholder="역 이름 검색 (예: 강남, 사당)"
                   role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="station-list"
                   aria-describedby="station-error">
            <button type="button" class="icon-btn" id="station-clear" aria-label="역 이름 지우기" hidden>
              <svg class="ic" aria-hidden="true"><use href="#i-x"></use></svg>
            </button>
          </div>
          <ul class="suggest glass" id="station-list" role="listbox" aria-label="역 추천" hidden></ul>
        </div>
      </div>
      <p class="field-error" id="station-error" role="alert"></p>

      <div class="watch-summary glass" id="watch-alerts" hidden></div>

      <div class="chips" id="recent-chips"></div>
      <div class="line-picker glass" id="line-picker" hidden>
        <p class="line-picker-title">어느 호선이었나요? <span>열차 안에서 잃어버렸다면 노선 전체와 유실물센터를 함께 찾아요</span></p>
        <div class="line-groups" id="line-grid"></div>
      </div>

      <fieldset class="field">
        <legend class="field-label">물품 <span class="field-hint">고르지 않으면 전체</span></legend>
        <div class="cat-grid" id="cat-grid"></div>
      </fieldset>

      <fieldset class="field">
        <legend class="field-label">언제쯤?</legend>
        <div class="segmented" id="period"></div>
      </fieldset>

      <div class="tip">
        <svg class="ic" aria-hidden="true"><use href="#i-info"></use></svg>
        <p>역에서 맡긴 물건은 보통 며칠 안에 노선별 유실물센터로 옮겨져요. 역 이름으로 찾으면 센터로 옮겨진 물건도 원래 습득한 역 기준으로 함께 보여드려요.</p>
      </div>

      <p class="sync-note" id="sync-note" aria-live="polite"></p>

      <div class="cta-bar">
        <button type="submit" class="btn-primary">
          <svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg>
          분실물 검색
        </button>
      </div>
    </form>
  </section>

  <!-- ② 결과 -->
  <section class="view" id="view-results" aria-labelledby="results-title" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <a class="back" href="#/" aria-label="검색 조건으로 돌아가기">
          <svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg>
        </a>
        <h1 id="results-title" tabindex="-1">검색 결과</h1>
      </div>
      <div class="filter-chips" id="result-chips"></div>
    </header>
    <div class="results-body" id="results-body"></div>
  </section>

  <!-- ③ 찾으러 가기 -->
  <section class="view" id="view-item" aria-labelledby="item-title" hidden>
    <header class="topbar">
      <div class="topbar-row">
        <a class="back" id="item-back" href="#/" aria-label="검색 결과로 돌아가기">
          <svg class="ic" aria-hidden="true"><use href="#i-back"></use></svg>
        </a>
        <h1 id="item-title" tabindex="-1">찾으러 가기</h1>
      </div>
    </header>
    <div class="item-body" id="item-body"></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js" defer></script>
</body>
</html>
