name: Sync LOST112 to Turso

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,12 * * *'

permissions:
  contents: read

concurrency:
  group: lost112-turso-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Fetch LOST112 data into Turso
        env:
          LOST112_SERVICE_KEY: ${{ secrets.LOST112_SERVICE_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        shell: bash
        run: |
          for name in LOST112_SERVICE_KEY TURSO_DATABASE_URL TURSO_AUTH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name repository secret is missing"
              exit 1
            fi
          done
          python -m lost112.sync auto
